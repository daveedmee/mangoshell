# ── Window rules: apps that stay fully opaque ──────────────────────────
# The app list lives in [var], so this template is the only
# rule needed. It applies full opacity and skips blur for every listed app.

[var]
# Apps that should stay fully opaque and unblurred.
# Add an app by appending "|<app_id>" to this list.
# Matching is case-insensitive PCRE substring, so "firefox" also matches
# org.mozilla.firefox and "steam" also matches Steam/steam_app_*.
opaque_apps = "firefox|steam|gwenview"
floating_apps = "gpick|REPENTOGON|steam|nm-connection-editor|megasync|portal.desktop.kde"

[[rule.window_rule]]
app_id = "(?i)($opaque_apps)"
focused_opacity = 1.0
unfocused_opacity = 1.0
no_blur = 1

[[rule.window_rule]]
app_id = "(?i)($floating_apps)"
is_floating = 1
no_border = 1

# Firefox Picture-in-Picture is a separate window with the Firefox app ID and
# a localized PiP title. Match both so normal Firefox windows keep tiling.
[[rule.window_rule]]
app_id = "(?i)^(firefox|org\\.mozilla\\.firefox)$"
title = "(?i)(picture-in-picture|bild-im-bild|bild-in-bild)"
is_floating = 1

# ── Layer rules ────────────────────────────────────────────────────────
[[rule.layer_rule]]
animation_type_open = "zoom"
layer_name = "rofi"

[[rule.layer_rule]]
animation_type_close = "zoom"
layer_name = "rofi"

# slurp's selection surface must stay crisp while choosing a screenshot.
# Layer blur would otherwise wash out the dimmed screen underneath.
[[rule.layer_rule]]
layer_name = "selection"
no_blur = 1
